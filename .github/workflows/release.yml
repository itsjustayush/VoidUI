name: Build & Package VoidUI Extension

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Extension (Vite & TypeScript)
        run: npm run build

      - name: Package Chromium Extension
        run: |
          mkdir -p release
          cd dist && zip -r ../release/VoidUI-Extension.zip * && cd ..

      - name: Package Firefox Extension
        run: |
          mkdir -p dist_firefox
          cp -r dist/* dist_firefox/
          cp manifest.firefox.json dist_firefox/manifest.json
          cd dist_firefox && zip -r ../release/VoidUI-Firefox.zip * && cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: void-ui-packages
          path: release/*

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/VoidUI-Extension.zip
            release/VoidUI-Firefox.zip
          draft: false
          prerelease: false
          generate_release_notes: true
