<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14141c" />
      <stop offset="100%" stop-color="#060608" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="128" height="128" rx="36" fill="url(#bgGrad)" stroke="#22222e" stroke-width="2" />

  <!-- Outer Nothing Glyph Ring (Dotted) -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#333344" stroke-width="2" stroke-dasharray="3 5" />
  
  <!-- Red accent arc (Nothing Phone signature) -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#d71921" stroke-width="3.5" stroke-dasharray="28 200" stroke-linecap="round" />

  <!-- Stylized Void 'V' in Dot Matrix -->
  <!-- Top Left to Center -->
  <circle cx="40" cy="42" r="3.5" fill="#f0f0f5" />
  <circle cx="46" cy="54" r="3.5" fill="#f0f0f5" />
  <circle cx="52" cy="66" r="3.5" fill="#f0f0f5" />
  <circle cx="58" cy="78" r="3.5" fill="#f0f0f5" />
  
  <!-- Center Vertex -->
  <circle cx="64" cy="90" r="4.5" fill="#d71921" filter="url(#glow)" />

  <!-- Top Right to Center -->
  <circle cx="88" cy="42" r="3.5" fill="#f0f0f5" />
  <circle cx="82" cy="54" r="3.5" fill="#f0f0f5" />
  <circle cx="76" cy="66" r="3.5" fill="#f0f0f5" />
  <circle cx="70" cy="78" r="3.5" fill="#f0f0f5" />

  <!-- Caelestia Cyan Center Pulse Dot -->
  <circle cx="64" cy="52" r="2.5" fill="#00f2fe" filter="url(#glow)" />
</svg>